name: Preview Pages
on:
  push:
    branches: [claude/just-mushrooms-rebuild-q3a9e4, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull Drive images
        run: |
          pip install -q gdown
          mkdir -p /tmp/drive
          gdown --folder "https://drive.google.com/drive/folders/1YXnsT47PMXUNkULeuG1jWII37UcwKsWW" -O /tmp/drive/rerun || true
          gdown --folder "https://drive.google.com/drive/folders/1km7x5KEJfA0gVvq9mxRZiEhmBVCW8fut" -O /tmp/drive/bundle || true
          python3 scripts/preview/flatten-drive-images.py /tmp/drive preview/assets/img
          ls preview/assets/img | wc -l
      - name: Install and render
        working-directory: preview
        run: |
          npm install
          node render.mjs
          node pages-rewrite.mjs
      - name: Stage Pages root
        run: |
          mkdir -p _site
          cp -a preview/dist/. _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
