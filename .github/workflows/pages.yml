name: Preview Pages
on:
  push:
    branches: [claude/just-mushrooms-rebuild-q3a9e4, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# A single "pages" group meant a PR run cancelled the push run for the same commit, and the
# cancelled jobs then showed on the PR as if they had failed. Keep one stream per PR and one
# per branch instead; the deploy job below carries its own serialised group, since only the
# actual Pages deployment needs to be exclusive.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Gate the deploy on the checks the README quotes, so its figures cannot drift from the
  # committed code again (GT-AUD-JM-2026-09-05 H2). The reports these produce are committed
  # under preview/reports/ and re-uploaded here for the run that generated them.
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Data pack matches the approved SEO metadata
        run: python3 scripts/build-seo-metadata.py --check
      # Reports the regulatory and client-input blockers that cannot be closed in code.
      # Deliberately non-gating: these must stay visible on every run without stopping the
      # preview from deploying. Use --strict as a pre-deployment gate for the real store.
      - name: Launch blockers still outstanding
        run: python3 scripts/check-launch-readiness.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        working-directory: preview
        run: npm ci
      - name: Render
        working-directory: preview
        run: node render.mjs
      - name: Assertion suite
        working-directory: preview
        run: node tests/run.mjs
      - name: Install Chromium for axe
        working-directory: preview
        run: npx playwright install --with-deps chromium
      - name: Serve and run axe
        working-directory: preview
        run: |
          node serve.mjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tests/axe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axe-report
          path: preview/reports/axe.json

  build:
    needs: qa
    # PRs get the QA gate but never publish: the Pages site is shared, and a PR build would
    # overwrite the branch preview with unreviewed content.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Product photography is refreshed from Drive when it is reachable. The theme's own
      # brand assets are committed under theme/assets/ and are never fetched here — CI used
      # to download the live store's logo and overwrite og-image.jpg, which is exactly the
      # hot-link the audit flagged.
      - name: Pull Drive images
        run: |
          set -euo pipefail
          pip install -q gdown
          mkdir -p /tmp/drive
          gdown --folder "https://drive.google.com/drive/folders/1YXnsT47PMXUNkULeuG1jWII37UcwKsWW" -O /tmp/drive/rerun \
            || echo "::warning::Drive 'rerun' folder unavailable; falling back to committed images"
          gdown --folder "https://drive.google.com/drive/folders/1km7x5KEJfA0gVvq9mxRZiEhmBVCW8fut" -O /tmp/drive/bundle \
            || echo "::warning::Drive 'bundle' folder unavailable; falling back to committed images"
          python3 scripts/preview/flatten-drive-images.py /tmp/drive preview/assets/img
      # The 23 product photographs are derived from data/live-product-images rather than
      # committed (L5), and the inventory check below runs before render.mjs would do it.
      # Without this the floor check depends on the Drive download having succeeded, which
      # is exactly the case the warnings above say is survivable.
      - name: Materialise derived product images
        run: node scripts/preview/sync-product-images.mjs
      # A silently degraded image set used to deploy anyway. Fail instead: with the derived
      # images materialised, this trips only if images really went missing.
      - name: Check image inventory
        run: |
          set -euo pipefail
          count=$(ls preview/assets/img | wc -l)
          echo "preview/assets/img: $count files"
          if [ "$count" -lt 52 ]; then
            echo "::error::Expected at least 52 preview images, found $count."
            exit 1
          fi
      - name: Install and render
        working-directory: preview
        run: |
          set -euo pipefail
          npm ci
          node render.mjs
          node pages-rewrite.mjs
      # pages-rewrite.mjs injects noindex,nofollow and writes a disallow-all robots.txt.
      # Assert it rather than trusting it: this is a public copy of the whole catalogue.
      - name: Verify the preview is not indexable
        run: |
          set -euo pipefail
          test -f preview/dist/robots.txt
          grep -q 'Disallow: /' preview/dist/robots.txt
          missing=$(grep -rL 'name="robots" content="noindex,nofollow"' preview/dist --include='*.html' | wc -l)
          echo "pages without noindex: $missing"
          test "$missing" -eq 0
      - name: Stage Pages root
        run: |
          mkdir -p _site
          cp -a preview/dist/. _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Only the deployment itself needs to be exclusive across branches, and it queues rather
    # than cancelling — a half-applied Pages deployment is worse than a slow one.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
